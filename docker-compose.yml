services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: corporatechat-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - corporatechat-sqlserver-data:/var/opt/mssql
    networks:
      - corporatechat-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  server:
    container_name: corporatechat-server
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      sqlserver:
        condition: service_healthy

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CorporateChatDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER:-CorporateChat}"
      Jwt__Audience: "${JWT_AUDIENCE:-CorporateChatUsers}"
      Jwt__ExpireMinutes: "${JWT_EXPIRE_MINUTES:-60}"
      Jwt__RefreshTokenExpireDays: "${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}"

      Cors__AllowedOrigins__0: "${CORS_ORIGIN_0:-http://localhost:8080}"

      FileStorage__UploadPath: "${UPLOAD_PATH:-/app/data/uploads}"
      FileStorage__MaxFileSizeMB: "${MAX_FILE_SIZE_MB:-50}"

    volumes:
      - corporatechat-files:/app/data

    networks:
      - corporatechat-network

    restart: unless-stopped

networks:
  corporatechat-network:
    driver: bridge

volumes:
  corporatechat-sqlserver-data:
  corporatechat-files:
